plugins {
    alias(libs.plugins.android.application)
    // Applied below, only when a google-services.json is present.
    alias(libs.plugins.google.services) apply false
    alias(libs.plugins.firebase.crashlytics) apply false
}

// Firebase is optional in this sample.
//
// google-services.json is gitignored, and the google-services plugin fails the build when it is
// missing — so applying it unconditionally meant nobody could build this sample without first
// creating a Firebase project, for a dependency the Hubble SDK does not need. Drop a
// google-services.json into app/ to get Crashlytics and Analytics; leave it out and the app builds
// and runs exactly the same, minus crash reporting.
def firebaseConfig = file("google-services.json")
def firebaseEnabled = firebaseConfig.exists()
if (firebaseEnabled) {
    apply plugin: libs.plugins.google.services.get().pluginId
    apply plugin: libs.plugins.firebase.crashlytics.get().pluginId
} else {
    logger.lifecycle("[quickstart] No app/google-services.json — building without Firebase "
            + "Crashlytics/Analytics. This is supported; see README.")
}

// Read local.properties once for SDK key, signing, etc.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newInputStream())
}

android {
    namespace = "com.hubble.quickstart.gateway"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.hubble.quickstart.gateway"
        minSdk = 21
        targetSdk = 35
        versionCode = 5
        versionName = "0.2.6"
        multiDexEnabled = true

        buildConfigField "String", "HUBBLE_SDK_KEY",
                "\"${localProps.getProperty("hubbleSdkKey", "")}\""
        buildConfigField "boolean", "FIREBASE_ENABLED", "${firebaseEnabled}"
    }

    signingConfigs {
        release {
            // CI: decode base64 keystore from env var to a temp file
            // Local: read keystore path from local.properties
            def keystoreBase64 = System.getenv("KEYSTORE_BASE64")
            if (keystoreBase64 != null) {
                def keystoreFile = file("${buildDir}/keystore.jks")
                keystoreFile.parentFile.mkdirs()
                keystoreFile.bytes = Base64.decoder.decode(keystoreBase64)
                storeFile = keystoreFile
            } else {
                storeFile = file(localProps.getProperty("releaseKeystoreFile", "hubble-quickstart.jks"))
            }
            storePassword = System.getenv("KEYSTORE_PASSWORD") ?: localProps.getProperty("releaseKeystorePassword", "")
            keyAlias = System.getenv("KEY_ALIAS") ?: localProps.getProperty("releaseKeyAlias", "")
            keyPassword = System.getenv("KEY_PASSWORD") ?: localProps.getProperty("releaseKeyPassword", "")
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro",
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    implementation(libs.hubble.gateway.sdk)
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.constraintlayout)
    if (firebaseEnabled) {
        implementation(libs.firebase.crashlytics)
        implementation(libs.firebase.analytics)
    }
}
